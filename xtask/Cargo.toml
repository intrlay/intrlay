[package]
name = "xtask"
description = "Intrlay development, packaging, and release automation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
flate2 = "1.1"
glob = "0.3"
regex = "1.12"
semver = "1.0"
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
tar = "0.4"
tempfile = "3.23"
toml = "1.0"
ureq = { version = "3.5", default-features = false, features = ["rustls"] }
which = "8.0"
zip = { version = "6.0", default-features = false, features = ["deflate-flate2"] }

[lints]
workspace = true
